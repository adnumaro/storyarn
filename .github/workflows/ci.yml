name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  MIX_ENV: test
  ELIXIR_VERSION: "1.20.4"
  OTP_VERSION: "29.0.6"
  NODE_VERSION: "24"

jobs:
  lint:
    name: Lint + JS Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: deps
          key: ${{ runner.os }}-mix-${{ env.ELIXIR_VERSION }}-otp-${{ env.OTP_VERSION }}-${{ github.job }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ env.ELIXIR_VERSION }}-otp-${{ env.OTP_VERSION }}-${{ github.job }}-
            ${{ runner.os }}-mix-${{ env.ELIXIR_VERSION }}-otp-${{ env.OTP_VERSION }}-

      # Cache entries are immutable; save each commit and restore the latest compatible build.
      - name: Cache _build
        uses: actions/cache@v4
        with:
          path: _build
          key: ${{ runner.os }}-build-${{ env.ELIXIR_VERSION }}-otp-${{ env.OTP_VERSION }}-${{ env.MIX_ENV }}-${{ github.job }}-${{ hashFiles('mix.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.ELIXIR_VERSION }}-otp-${{ env.OTP_VERSION }}-${{ env.MIX_ENV }}-${{ github.job }}-${{ hashFiles('mix.lock') }}-
            ${{ runner.os }}-build-${{ env.ELIXIR_VERSION }}-otp-${{ env.OTP_VERSION }}-${{ env.MIX_ENV }}-${{ github.job }}-
            ${{ runner.os }}-build-${{ env.ELIXIR_VERSION }}-otp-${{ env.OTP_VERSION }}-${{ env.MIX_ENV }}-
            ${{ runner.os }}-build-${{ env.ELIXIR_VERSION }}-otp-${{ env.OTP_VERSION }}-

      - name: Install Elixir dependencies
        run: mix deps.get

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Check Elixir formatting
        run: mix format --check-formatted

      - name: Check backend translation extraction
        run: mix gettext.extract --check-up-to-date

      - name: Check backend conventions
        run: mix convention.check

      - name: Check backend architecture
        run: mix architecture.check

      - name: Run Credo
        run: mix credo --strict

      - name: Run Sobelow (security)
        run: mix sobelow --config

      - name: Run JS checks
        run: pnpm run fmt:check && pnpm run lint && pnpm run typecheck

      - name: Check frontend architecture
        run: pnpm arch

      - name: Run JS tests (Vitest)
        run: pnpm test

  elixir-tests:
    name: Elixir Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: storyarn_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: deps
          key: ${{ runner.os }}-mix-${{ env.ELIXIR_VERSION }}-otp-${{ env.OTP_VERSION }}-${{ github.job }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ env.ELIXIR_VERSION }}-otp-${{ env.OTP_VERSION }}-${{ github.job }}-
            ${{ runner.os }}-mix-${{ env.ELIXIR_VERSION }}-otp-${{ env.OTP_VERSION }}-

      # Cache entries are immutable; save each commit and restore the latest compatible build.
      - name: Cache _build
        uses: actions/cache@v4
        with:
          path: _build
          key: ${{ runner.os }}-build-${{ env.ELIXIR_VERSION }}-otp-${{ env.OTP_VERSION }}-${{ env.MIX_ENV }}-${{ github.job }}-${{ hashFiles('mix.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.ELIXIR_VERSION }}-otp-${{ env.OTP_VERSION }}-${{ env.MIX_ENV }}-${{ github.job }}-${{ hashFiles('mix.lock') }}-
            ${{ runner.os }}-build-${{ env.ELIXIR_VERSION }}-otp-${{ env.OTP_VERSION }}-${{ env.MIX_ENV }}-${{ github.job }}-
            ${{ runner.os }}-build-${{ env.ELIXIR_VERSION }}-otp-${{ env.OTP_VERSION }}-${{ env.MIX_ENV }}-
            ${{ runner.os }}-build-${{ env.ELIXIR_VERSION }}-otp-${{ env.OTP_VERSION }}-

      - name: Install Elixir dependencies
        run: mix deps.get

      # Keep compilation separate so cache misses do not inflate ExUnit timings.
      - name: Compile Elixir test code
        run: mix compile --warnings-as-errors

      - name: Run Elixir tests
        run: mix test
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/storyarn_test

  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: storyarn_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: deps
          key: ${{ runner.os }}-mix-${{ env.ELIXIR_VERSION }}-otp-${{ env.OTP_VERSION }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ env.ELIXIR_VERSION }}-otp-${{ env.OTP_VERSION }}-

      # Cache entries are immutable; save each commit and restore the latest compatible build.
      - name: Cache _build
        uses: actions/cache@v4
        with:
          path: _build
          key: ${{ runner.os }}-build-${{ env.ELIXIR_VERSION }}-otp-${{ env.OTP_VERSION }}-${{ env.MIX_ENV }}-${{ github.job }}-${{ hashFiles('mix.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.ELIXIR_VERSION }}-otp-${{ env.OTP_VERSION }}-${{ env.MIX_ENV }}-${{ github.job }}-${{ hashFiles('mix.lock') }}-
            ${{ runner.os }}-build-${{ env.ELIXIR_VERSION }}-otp-${{ env.OTP_VERSION }}-${{ env.MIX_ENV }}-
            ${{ runner.os }}-build-${{ env.ELIXIR_VERSION }}-otp-${{ env.OTP_VERSION }}-

      - name: Install Elixir dependencies
        run: mix deps.get

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps

      - name: Compile
        run: mix compile

      - name: Setup database
        run: mix ecto.create && mix ecto.migrate
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/storyarn_test

      - name: Run E2E tests
        run: mix test.e2e
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/storyarn_test
          PLAYWRIGHT_HEADLESS: true

  validate-exports:
    name: Validate Exports (ysc + inklecate)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: storyarn_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Cache ysc build
        uses: actions/cache@v4
        id: ysc-cache
        with:
          path: /opt/ysc
          key: ysc-v3.1.0-linux-x64

      - name: Build ysc from source
        if: steps.ysc-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch v3.1.0 \
            https://github.com/YarnSpinnerTool/YarnSpinner-Console.git /tmp/ysc-src
          dotnet publish /tmp/ysc-src/src/YarnSpinner.Console/ysc.csproj \
            -c Release -r linux-x64 --self-contained true -o /opt/ysc
          chmod +x /opt/ysc/ysc
          rm -rf /tmp/ysc-src

      - name: Add ysc to PATH
        run: echo "/opt/ysc" >> $GITHUB_PATH

      - name: Verify ysc works
        run: ysc --help

      - name: Cache inklecate build
        uses: actions/cache@v4
        id: inklecate-cache
        with:
          path: /opt/inklecate
          key: inklecate-v1.2.0-linux-x64

      - name: Build inklecate from source
        if: steps.inklecate-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch v.1.2.0 \
            https://github.com/inkle/ink.git /tmp/inklecate-src
          dotnet publish /tmp/inklecate-src/inklecate/inklecate.csproj \
            -c Release -r linux-x64 --self-contained true \
            /p:PublishTrimmed=false /p:PublishSingleFile=true \
            -o /opt/inklecate
          chmod +x /opt/inklecate/inklecate
          rm -rf /tmp/inklecate-src

      - name: Add inklecate to PATH
        run: echo "/opt/inklecate" >> $GITHUB_PATH

      - name: Verify inklecate works
        run: inklecate --help || true

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: deps
          key: ${{ runner.os }}-mix-${{ env.ELIXIR_VERSION }}-otp-${{ env.OTP_VERSION }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ env.ELIXIR_VERSION }}-otp-${{ env.OTP_VERSION }}-

      # Cache entries are immutable; save each commit and restore the latest compatible build.
      - name: Cache _build
        uses: actions/cache@v4
        with:
          path: _build
          key: ${{ runner.os }}-build-${{ env.ELIXIR_VERSION }}-otp-${{ env.OTP_VERSION }}-${{ env.MIX_ENV }}-${{ github.job }}-${{ hashFiles('mix.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.ELIXIR_VERSION }}-otp-${{ env.OTP_VERSION }}-${{ env.MIX_ENV }}-${{ github.job }}-${{ hashFiles('mix.lock') }}-
            ${{ runner.os }}-build-${{ env.ELIXIR_VERSION }}-otp-${{ env.OTP_VERSION }}-${{ env.MIX_ENV }}-
            ${{ runner.os }}-build-${{ env.ELIXIR_VERSION }}-otp-${{ env.OTP_VERSION }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Compile
        run: mix compile

      - name: Run Yarn export validation tests
        run: mix test --only ysc_validation
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/storyarn_test

      - name: Run Ink export validation tests
        run: mix test --only ink_validation
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/storyarn_test
